name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    name: smoke (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant:
          # The full run uses the code as it is.
          - full
          # BEGIN sample-resource
          # The without-sample run removes the sample resource first. It shows that the removal keeps the app green.
          - without-sample
          # END sample-resource
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The cache keeps the Chromium download out of most runs. The install step is fast on a cache hit, and it still installs the system packages.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # uv installs the locked Python packages of the topic engine in engine/. The cache keeps the downloads out of most runs.
      # setup-uv has no major version tag, so the step names a full version. The uv version matches engine/Dockerfile.
      # Change both together.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Install the engine packages
        run: uv sync --directory engine --frozen
      # BEGIN sample-resource
      - name: Remove the sample resource, then lint and check types
        if: matrix.variant == 'without-sample'
        run: |
          node scripts/remove-sample.mjs --yes
          npx astro sync
          npm run lint
          npx astro check
      # END sample-resource
      - name: Set up local Supabase and env files
        run: node scripts/local.mjs --setup-only --exclude=studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      # A random test secret for the Send Email Hook steps. The smoke test signs its hook calls with the same value.
      # ALLOW_LOOK_OVERRIDE lets the phone check select each look with the cookie "look". The deploy job does not set it.
      # OAUTH_PROVIDERS shows the OAuth buttons for the smoke test and the phone check. The local Supabase needs no provider:
      # the start route builds the authorize URL without a call to Supabase, and a test code fails the callback in all cases.
      # ENABLE_JOB_CHECK turns on the job check page for the phone check and the job steps of the smoke test.
      # The wake values are the local defaults of npm run worker. SMOKE_JOB_CHECK turns on the job steps.
      # ALLOW_PRIVATE_COURSE_URLS lets the app accept the localhost URL of the fixture course site. Production keeps it off.
      # SMOKE_COURSES turns on the course steps and the extension steps of the smoke test.
      # SMOKE_TOPICS turns on the topic steps of the smoke test. They need the engine with the fake model.
      - name: Write a test Send Email Hook secret, the look override, the OAuth providers, the job check, the courses and the topics
        run: |
          secret="v1,whsec_$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "SEND_EMAIL_HOOK_SECRET=$secret" >> .dev.vars
          echo "ALLOW_LOOK_OVERRIDE=true" >> .dev.vars
          echo "OAUTH_PROVIDERS=github,google" >> .dev.vars
          echo "ENABLE_JOB_CHECK=true" >> .dev.vars
          echo "ALLOW_PRIVATE_COURSE_URLS=true" >> .dev.vars
          echo "WORKER_WAKE_URL=http://localhost:8788/wake" >> .dev.vars
          echo "WORKER_WAKE_SECRET=local-wake-secret" >> .dev.vars
          echo "SMOKE_HOOK_SECRET=$secret" >> "$GITHUB_ENV"
          echo "SMOKE_JOB_CHECK=1" >> "$GITHUB_ENV"
          echo "SMOKE_COURSES=1" >> "$GITHUB_ENV"
          echo "SMOKE_TOPICS=1" >> "$GITHUB_ENV"
      - name: Run database policy tests
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            npx supabase test db
          else
            echo "::notice::supabase/tests has no .sql file. The step does not run npx supabase test db."
          fi
      - name: Run the worker and extension unit tests
        run: npm run test:unit
      - name: Run the engine tests
        run: npm run test:engine
      - name: Build the extension
        run: npm run build:extension
      - run: npm run build
      # The fixture course site starts before the worker, so the first course load finds it.
      # Its log shows each request of the crawl with its status and user agent. The last step shows the file.
      - name: Start the fixture course site
        run: |
          nohup node scripts/fixture-server.mjs > "$RUNNER_TEMP/fixture.log" 2>&1 < /dev/null &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8799/robots.txt && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8799/robots.txt || { echo "fixture site did not start"; cat "$RUNNER_TEMP/fixture.log"; exit 1; }
      # The topic engine starts before the worker, so the first topic job finds it. It listens on 127.0.0.1:8790.
      # --fake gives it the fake model of scripts/fake-model.mjs on 127.0.0.1:8791. The fake model needs no key and no
      # network. No step sets a model key. The first start imports Cognee, so the wait is longer than for the worker.
      # Its output goes to a file, so the step does not hold the output stream open. The last step shows the file.
      - name: Start the topic engine with the fake model
        run: |
          nohup npm run engine -- --fake > "$RUNNER_TEMP/engine.log" 2>&1 < /dev/null &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8790/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8790/health || { echo "engine did not start"; cat "$RUNNER_TEMP/engine.log"; exit 1; }
      # The worker reads the local Supabase values into memory and never prints the key.
      # The job sets no ANTHROPIC_API_KEY, so the lesson finder uses its rule and the course steps need no model call.
      # ALLOW_PRIVATE_COURSE_URLS turns off the address check of the crawl, so the worker reads the fixture site on localhost.
      # The deploy-worker job does not set it.
      # The worker sends each topic job to the local engine of the step before, with the local secret of npm run engine.
      # Its output goes to a file, so the step does not hold the output stream open. The last step shows the file.
      - name: Start the worker
        env:
          ALLOW_PRIVATE_COURSE_URLS: "true"
          TOPIC_ENGINE_URL: http://127.0.0.1:8790
          TOPIC_ENGINE_SECRET: local-engine-secret
        run: |
          nohup npm run worker > "$RUNNER_TEMP/worker.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/health && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8788/health || { echo "worker did not start"; cat "$RUNNER_TEMP/worker.log"; exit 1; }
      - name: Run the phone check and the smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:4321/ || { echo "preview did not start"; exit 1; }
          # The full variant checks every look. The other variants check the active look only.
          LOOKS="${{ matrix.variant == 'full' && 'all' || '' }}" BASE_URL=http://localhost:4321 npm run phone-check
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/worker.log" ]; then
            echo "::group::Worker log"
            cat "$RUNNER_TEMP/worker.log"
            echo "::endgroup::"
          fi
          if [ -f "$RUNNER_TEMP/fixture.log" ]; then
            echo "::group::Fixture course site log"
            cat "$RUNNER_TEMP/fixture.log"
            echo "::endgroup::"
          fi
          # The engine log holds the lines of the fake model and of the engine. Neither logs the lesson text or a key.
          if [ -f "$RUNNER_TEMP/engine.log" ]; then
            echo "::group::Topic engine and fake model log"
            cat "$RUNNER_TEMP/engine.log"
            echo "::endgroup::"
          fi
          npx supabase stop --no-backup

  deploy:
    needs: [ci, smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    # A newer merge waits for the running deploy. It does not cancel it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # GitHub does not allow secrets in a job-level "if". This step checks them and sets "ready".
      - name: Check production settings
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "::notice::Deploy skipped. CLOUDFLARE_API_TOKEN is not set. See the README section \"Deployment > One-time setup\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_KEY SUPABASE_DB_URL PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy cannot start. Set these values in the production environment:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.settings.outputs.ready == 'true'
        run: npm ci
      - name: Build with the commit SHA as the version
        if: steps.settings.outputs.ready == 'true'
        run: npm run build
        env:
          BUILD_VERSION: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # The build fixes the OAuth buttons. Without the variable, the app shows no OAuth button.
          OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
          # The build fixes the job check page. Without the variable, the page answers 404. Set it only for a check.
          ENABLE_JOB_CHECK: ${{ vars.ENABLE_JOB_CHECK }}
      # Migrations run before the deploy. A failed migration stops the job before the new code goes live.
      - name: Apply database migrations
        if: steps.settings.outputs.ready == 'true'
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The file stays outside the workspace. jq escapes the values. No step prints them.
      # The email values and the wake values are optional. The step adds each one only when it is set,
      # so an empty value never replaces a Worker secret.
      - name: Write the Worker secrets file
        if: steps.settings.outputs.ready == 'true'
        run: |
          umask 077
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_KEY" \
            --arg resend "$RESEND_API_KEY" \
            --arg hook "$SEND_EMAIL_HOOK_SECRET" \
            --arg from "$EMAIL_FROM" \
            --arg admin "$ADMIN_EMAIL" \
            --arg percent "$EMAIL_QUOTA_ALERT_PERCENT" \
            --arg wake_url "$WORKER_WAKE_URL" \
            --arg wake_secret "$WORKER_WAKE_SECRET" \
            '{SUPABASE_URL:$url,SUPABASE_KEY:$key}
            + {RESEND_API_KEY:$resend,SEND_EMAIL_HOOK_SECRET:$hook,EMAIL_FROM:$from,ADMIN_EMAIL:$admin,EMAIL_QUOTA_ALERT_PERCENT:$percent}
            + {WORKER_WAKE_URL:$wake_url,WORKER_WAKE_SECRET:$wake_secret}
              | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          EMAIL_QUOTA_ALERT_PERCENT: ${{ vars.EMAIL_QUOTA_ALERT_PERCENT }}
          # The wake request of the web app. WORKER_WAKE_URL is the worker address with /wake at the end.
          WORKER_WAKE_URL: ${{ vars.WORKER_WAKE_URL }}
          WORKER_WAKE_SECRET: ${{ secrets.WORKER_WAKE_SECRET }}
      - name: Deploy the Worker
        if: steps.settings.outputs.ready == 'true'
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" --message "CI deploy $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait for the new version on /healthcheck
        if: steps.settings.outputs.ready == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          url="${PRODUCTION_URL%/}/healthcheck"
          body="$RUNNER_TEMP/healthcheck.json"
          status=""
          version=""
          for i in $(seq 1 12); do
            rm -f "$body"
            status=$(curl -s --max-time 10 -o "$body" -w '%{http_code}' "$url" || true)
            version=$(jq -r '.version // empty' "$body" 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Version $version is live at $url."
              exit 0
            fi
            if [ "$i" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "::error::Version $GITHUB_SHA is not live after 60 seconds. Last HTTP status: ${status:-none}. Last version: ${version:-none}."
          exit 1
      - name: Delete the Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"

  # The background worker in worker/ runs on Google Cloud Run. This job deploys it. The deploy job does not wait for it.
  deploy-worker:
    needs: [ci, smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Workload Identity Federation signs in to Google with the GitHub token of the job. The repo holds no Google key.
      id-token: write
    # A newer merge waits for the running worker deploy. It does not cancel it.
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      # GitHub does not allow secrets in a job-level "if". This step checks them and sets "ready".
      - name: Check worker settings
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "::notice::Worker deploy skipped. GCP_WORKLOAD_IDENTITY_PROVIDER is not set. See the README section \"Deployment > Background worker\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Worker deploy cannot start. Set these values in the production environment:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # The full history lets the next step compare the commit before the push with the new commit.
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A manual run always deploys. A push deploys only when a file in worker/ changed.
      # When the commit before the push is not known (a new branch, or a commit that the clone does not have), the job deploys.
      - name: Check for worker changes
        id: changes
        if: steps.settings.outputs.ready == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::The commit before the push is not known. The job deploys the worker."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff --quiet exits 0 when nothing changed. A change or an error deploys.
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- worker/; then
            echo "::notice::Worker deploy skipped. No file in worker/ changed in this push."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign in to Google Cloud
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # Cloud Build builds the image from worker/Dockerfile. The service runs at most one instance and none when idle.
      # --no-cpu-throttling keeps the CPU on after the reply to the wake request, so a job runs to its end.
      # --no-invoker-iam-check makes the address public. The wake secret protects POST /wake.
      # The Supabase service key goes only to this service, from Secret Manager. It never goes to the Cloudflare Worker.
      # The Anthropic key also comes from Secret Manager. The lesson finder uses it to pick the lessons of a course.
      - name: Deploy the worker to Cloud Run
        id: deploy
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: rubber-duck-on-steroids-worker
          source: worker
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          flags: --no-cpu-throttling --no-invoker-iam-check --min-instances=0 --max-instances=1 --cpu=1 --memory=512Mi
          env_vars: |-
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            WORKER_ALLOW_DEMO=${{ vars.ENABLE_JOB_CHECK }}
          # The secret values come from Google Secret Manager, so the Cloud Run console does not show them.
          secrets: |-
            SUPABASE_SERVICE_KEY=worker-supabase-service-key:latest
            WORKER_WAKE_SECRET=worker-wake-secret:latest
            ANTHROPIC_API_KEY=worker-anthropic-api-key:latest
      # The first deploy needs this address for the variable WORKER_WAKE_URL.
      - name: Show the worker address
        if: steps.changes.outputs.deploy == 'true'
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: echo "::notice::The worker is live at $SERVICE_URL. Set WORKER_WAKE_URL to $SERVICE_URL/wake."
